[tool.poetry]
name = "personabot"
version = "0.1.0"
description = "Discord bot that scrapes user messages and exports structured JSONL corpora"
authors = ["McDon"]
readme = "README.md"
packages = [{include = "personabot", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
"discord.py" = ">=2.5,<3.0"
asyncpg = ">=0.29,<1.0"
pydantic = ">=2.0,<3.0"
pydantic-settings = ">=2.0,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
black = ">=24.0,<26.0"
ruff = ">=0.4,<1.0"
isort = ">=5.0,<6.0"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "discord.*",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
# Session-scoped default lets the session-scoped db_pool fixture and the
# function-scoped db_connection fixture share a single asyncio event loop.
# Without this, asyncpg connections created in session setup are pinned to
# an event loop that has been torn down by the time a per-test fixture runs,
# producing "another operation is in progress" InterfaceError.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that require real API calls (deselect with '-m \"not integration\"')",
]
